plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'br.edu.ifrs.tcc_novo'
    compileSdk 36 // <-- MUDAR AQUI (DE 34 PARA 36)

    defaultConfig {
        applicationId "br.edu.ifrs.tcc_novo"
        minSdk 24
        targetSdk 36 // <-- MUDAR AQUI (DE 34 PARA 36)
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources.excludes.add("META-INF/atomicfu.kotlin_module")
    }

//    sourceSets {
//        main {
//            jniLibs.srcDirs = ['src/main/jniLibs']
//        }
//    }
}

dependencies {
    // Dependências padrão
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.annotation
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // OpenCV
//    api(project(path: ":opencv2"))
//    implementation libs.opencv

    // Glide
    implementation(libs.glide.v4160)

    // Room
    def room_version = "2.6.1"
    implementation libs.room.runtime
    implementation libs.lifecycle.livedata.v283
    kapt "androidx.room:room-compiler:$room_version"

    // CameraX
    implementation 'androidx.camera:camera-core:1.2.3'
    implementation 'androidx.camera:camera-camera2:1.2.3'
    implementation 'androidx.camera:camera-lifecycle:1.2.3'
    implementation 'androidx.camera:camera-view:1.2.3'

    // OpenCV (Maven)
    implementation 'org.opencv:opencv:4.10.0'

    // util
    implementation 'com.google.guava:guava:32.1.2-android'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.10.1'
    implementation 'com.google.android.material:material:1.9.0'



}